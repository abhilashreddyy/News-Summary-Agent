<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tab Digest Agent</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 14px; width: 360px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    button { padding: 8px 10px; }
    .muted { color:#666; font-size:12px; }
    .tags { margin-top: 4px; }
    .tag { display:inline-block; font-size:12px; padding:2px 6px; border-radius:999px; border:1px solid #ddd; margin:2px 4px 0 0; }
    pre { white-space: pre-wrap; max-height: 180px; overflow:auto; background:#fafafa; border:1px solid #eee; padding:8px; }
    ul { padding-left: 18px; }
    .status { margin-left:8px; }
  </style>
</head>
<body>
  <h1>Tab Digest Agent</h1>
  <button id="run">Make Digest</button>
  <span id="status" class="muted status"></span>

  <hr />
  <div id="content"></div>

  <div style="margin-top:10px;">
    <button id="toggleLogs">Show Logs</button>
  </div>
  <div id="logsSection" style="display:none; margin-top:8px;">
    <h3 style="font-size:13px;margin:6px 0;">Live Logs</h3>
    <pre id="logBox"></pre>
  </div>

  <script src="popup.js"></script>
</body>
</html>
